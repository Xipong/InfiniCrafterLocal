[tool.ruff]
target-version = "py310"
line-length = 140
exclude = [
  ".git",
  ".pytest_cache",
  "**/__pycache__",
  "generator/cache",
  "generator/data",
  "build_logs",
  "artifacts",
]

[tool.ruff.lint]
# Deliberately narrow: agent-safety errors, not style churn.
select = ["E9", "F63", "F7", "F82"]

[tool.pyright]
pythonVersion = "3.10"
typeCheckingMode = "strict"
include = [
  "generator/infini_local/core/runtime_authoring/capability_registry.py",
  "generator/infini_local/core/runtime_authoring/compiler.py",
  "generator/infini_local/core/runtime_authoring/program_schema.py",
  "generator/infini_local/core/runtime_authoring/technical_lowering.py",
  "generator/infini_local/core/runtime_authoring/terraria_vocabulary.py",
  "tools/agentctl.py",
  "tools/checks/check_code_health.py",
  "tools/generate/config_registry.py",
  "tools/diagnostics/replay_generation_case.py",
  "tools/generate/export_contract_schemas.py",
  "tools/validate_release.py",
  "tools/diagnostics/render_validation_report.py",
  "tools/testing/run_pytest_shards.py",
  "tools/testing/run_pyright.py",
  "tools/checks/check_tml_selftest_report.py",
]
exclude = [
  "**/__pycache__",
  "generator/cache",
]
extraPaths = [".", "generator"]
reportMissingTypeStubs = "none"
reportUnknownArgumentType = "none"
reportUnknownMemberType = "none"
reportUnknownVariableType = "none"
reportUnknownParameterType = "none"

[tool.pytest.ini_options]
testpaths = ["tests/generator", "tests/toolbox"]
pythonpath = ["generator", "tests/generator", "."]
addopts = "-ra"
