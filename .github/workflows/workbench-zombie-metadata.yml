name: Inspect pinned zombie asset
on:
  pull_request:
    paths:
      - '.github/workflows/workbench-zombie-metadata.yml'
permissions:
  contents: read
jobs:
  metadata:
    runs-on: ubuntu-latest
    steps:
      - name: Verify original PNG and print digest
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/NPC_3.png" \
            https://raw.githubusercontent.com/sullerandras/terraria-hd-textures/c835594415e31ed88734dc778661014b48ffb648/source-pngs/NPC_3.png
          python - <<'PY'
          import hashlib, os, struct
          from pathlib import Path
          data = (Path(os.environ['RUNNER_TEMP']) / 'NPC_3.png').read_bytes()
          blob = hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest()
          if blob != 'bb2f33487edcd50bb956376a3f6421ab773f6dec' or len(data) != 1436:
              raise SystemExit('Unexpected upstream Git blob')
          if data[:8] != b'\x89PNG\r\n\x1a\n' or data[12:16] != b'IHDR':
              raise SystemExit('Invalid PNG')
          print('sha256:', hashlib.sha256(data).hexdigest())
          print('dimensions:', *struct.unpack('>II', data[16:24]))
          PY
