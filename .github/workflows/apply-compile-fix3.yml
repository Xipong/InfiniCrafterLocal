name: Apply final compact-analysis compile fix

on:
  push:
    branches:
      - perf/pr333-cold-under-5s

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Repair the two mismatched renamed locals
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('ModSources/InfiniCrafterLocal/Common/Services/Generation/GeneratorClient.SourceMethod.cs')
          text = path.read_text(encoding='utf-8')
          replacements = {
              'stores[local] = bit;': 'stores[local] = storedDefinitionBit;',
              'storeBits.TryGetValue(instruction.Offset, out int bit))\n                    {\n                        ClearLocal(state, localMasks[stored]); Set(state, storedDefinitionBit);':
              'storeBits.TryGetValue(instruction.Offset, out int storedDefinitionBit))\n                    {\n                        ClearLocal(state, localMasks[stored]); Set(state, storedDefinitionBit);',
          }
          for old, new in replacements.items():
              assert text.count(old) == 1, old
              text = text.replace(old, new, 1)
          assert 'stores[local] = bit;' not in text
          assert 'out int bit))\n                    {\n                        ClearLocal(state' not in text
          path.write_text(text, encoding='utf-8', newline='')
          PY
          git rm .github/workflows/apply-compile-fix3.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: complete compact-dataflow local rename'
          git push origin HEAD:perf/pr333-cold-under-5s
