name: Publish verified release
on:
  create:
  workflow_dispatch:
    inputs:
      apply:
        description: Apply guarded replacement (false only validates/downloads)
        type: boolean
        default: false
      tag:
        description: Existing version tag
        required: true
      target_sha:
        description: Exact final current-main commit with successful CI
        required: true
      expected_old_tag:
        description: Expected existing lightweight tag commit
        required: true
      release_id:
        description: Expected existing release numeric ID
        required: true
      expected_snapshot:
        description: SHA256 of canonical release metadata and asset snapshot
        required: true
permissions:
  contents: read
concurrency:
  group: publish-release
  cancel-in-progress: false
jobs:
  publish:
    if: github.repository == 'Xipong/InfiniCrafterLocal' && ((github.event_name == 'create' && github.event.ref_type == 'branch' && startsWith(github.event.ref, 'release/v')) || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - name: Guard main identity before executing repository code
        id: source
        uses: actions/github-script@v7
        with:
          retries: 0
          script: |
            if (context.eventName === 'workflow_dispatch') {
              if (context.ref !== 'refs/heads/main' || context.payload.inputs.target_sha !== context.sha) throw new Error('Replacement must pin current main');
            } else if (context.payload.ref_type !== 'branch' || !/^release\/v\d+\.\d+\.\d+$/.test(context.payload.ref)) throw new Error('Invalid release branch');
            const main = await github.rest.git.getRef({...context.repo, ref:'heads/main'});
            if (main.data.object.sha !== context.sha) throw new Error('Release source must equal current main');
            core.setOutput('sha', main.data.object.sha);
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.source.outputs.sha }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Admit exact main CI artifact
        id: admit
        uses: actions/github-script@v7
        with:
          retries: 0
          script: |
            const release = require('./tools/build/release_github.js');
            await release[context.eventName === 'workflow_dispatch' ? 'inspectReplacement' : 'admit']({github, context, core});
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ steps.admit.outputs.artifact }}
          run-id: ${{ steps.admit.outputs.run }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/ci-package
          merge-multiple: true
      - name: Verify package and prepare clean source archive
        env:
          RELEASE_VERSION: ${{ steps.admit.outputs.version }}
          RELEASE_SHA: ${{ github.sha }}
          CI_RUN: ${{ steps.admit.outputs.run }}
        run: |
          python tools/build/prepare_release.py --artifact "$RUNNER_TEMP/ci-package" --output "$RUNNER_TEMP/release-assets" --version "$RELEASE_VERSION" --sha "$RELEASE_SHA" --run-id "$CI_RUN"
      - name: Preserve verified old bytes before maintenance
        if: github.event_name == 'workflow_dispatch' && inputs.apply
        id: backup
        uses: actions/upload-artifact@v4
        with:
          name: release-backup-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.admit.outputs.backup }}
          if-no-files-found: error
          retention-days: 90
      - name: Publish once after all validation
        uses: actions/github-script@v7
        env:
          BACKUP_ARTIFACT_ID: ${{ steps.backup.outputs.artifact-id }}
          BACKUP_ARTIFACT_DIGEST: ${{ steps.backup.outputs.artifact-digest }}
          RELEASE_TAG: ${{ steps.admit.outputs.tag }}
          CI_RUN: ${{ steps.admit.outputs.run }}
        with:
          retries: 0
          script: |
            const release = require('./tools/build/release_github.js');
            await release[context.eventName === 'workflow_dispatch' ? 'replace' : 'publish']({github, context, core});
      - name: Preserve replacement outcome for recovery
        if: always() && github.event_name == 'workflow_dispatch' && inputs.apply
        uses: actions/upload-artifact@v4
        with:
          name: release-replacement-outcome-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/replacement-recovery.json
          if-no-files-found: warn
          retention-days: 90
