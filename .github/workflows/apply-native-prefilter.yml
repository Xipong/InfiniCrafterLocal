name: Apply native source prefilter

on:
  push:
    branches:
      - perf/pr333-cold-under-5s

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply conservative IL/CFG admission filter
        shell: bash
        run: |
          cat > /tmp/native-prefilter.patch.gz.b64 <<'EOF'

EOF
          base64 -d /tmp/native-prefilter.patch.gz.b64 | gzip -d > /tmp/native-prefilter.patch
          patch -p3 < /tmp/native-prefilter.patch
          git rm .github/workflows/apply-native-prefilter.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'perf: prove irrelevant native source before ILSpy'
          git push origin HEAD:perf/pr333-cold-under-5s
