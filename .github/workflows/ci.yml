name: InfiniCrafterLocal CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A PR gets one full workflow instead of both branch-push and PR copies.
# Unique run IDs keep every main/manual run, including pending runs, independent.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  python-partitions:
    name: Canonical Python partition matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.partition.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - id: partition
        run: |
          matrix="$(python tools/testing/run_pytest_shards.py --matrix)"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  python-shards:
    name: Python shard ${{ matrix.shard }}/${{ strategy.job-total }}
    needs: python-partitions
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.python-partitions.outputs.matrix) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: generator/requirements-dev.lock
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r generator/requirements-dev.lock
      - name: Run canonical pytest partition
        run: python tools/testing/run_pytest_shards.py --shard-index ${{ matrix.shard }} --timeout-seconds 300 --json-out artifacts/validation/pytest_shards.json
      - name: Upload partition coverage and timing
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-shard-${{ matrix.shard }}
          overwrite: true
          path: artifacts/validation/pytest_shards.json
          if-no-files-found: error

  python-tests:
    name: Python tests
    needs: [python-partitions, python-shards]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: generator/requirements-dev.lock
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r generator/requirements-dev.lock
      - name: Download this run's partition receipts
        uses: actions/download-artifact@v4
        with:
          pattern: pytest-shard-*
          path: artifacts/python-shards
      - name: Shared Python validation gates
        run: python tools/validate_release.py --group python --pytest-reports artifacts/python-shards
      - name: Require successful matrix job outcomes
        if: always()
        env:
          PLAN_RESULT: ${{ needs.python-partitions.result }}
          SHARD_RESULT: ${{ needs.python-shards.result }}
        run: test "$PLAN_RESULT" = success && test "$SHARD_RESULT" = success
      - name: Upload aggregate validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: python-validation
          overwrite: true
          path: artifacts/validation/
          if-no-files-found: error

  strict-hygiene:
    name: Strict hygiene and static contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: generator/requirements-dev.lock
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r generator/requirements-dev.lock
      - name: Shared static validation gates
        run: python tools/validate_release.py --group static
      - name: Strict archive hygiene
        run: |
          archive_root="$(mktemp -d)"
          git archive --format=tar HEAD | tar -xf - -C "$archive_root"
          (cd "$archive_root" && python tools/checks/check_project_hygiene.py --strict-archive)

  tml-native:
    name: Windows compilation and native CPU checks
    runs-on: windows-latest
    steps:
      - name: Preserve Git blob bytes for cross-platform release verification
        shell: pwsh
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-native-ci
        with:
          github-token: ${{ github.token }}
      - name: Record native check dependency identities
        run: python tools/testing/verify_ci_native_inputs.py --write-role native --output artifacts/native-inputs/native.json
      # Compile/native gates run separately from official release packaging.
      - name: Attempt tML project build
        id: tml
        shell: pwsh
        env:
          TmlBuildMod: 'false'
        run: |
          python tools/validate_release.py --group build --require-build
          exit $LASTEXITCODE
      - name: Native verification coverage
        if: always()
        shell: pwsh
        run: |
          $path = 'artifacts/validation/validation_report.json'
          $report = if (Test-Path $path) { Get-Content $path -Raw | ConvertFrom-Json } else { $null }
          $names = @('tml_build', 'native_checks', 'item_workbench_build', 'tml_runtime_selftest')
          Add-Content $env:GITHUB_STEP_SUMMARY '### Native verification coverage'
          Add-Content $env:GITHUB_STEP_SUMMARY '| Check | Actual status |'
          Add-Content $env:GITHUB_STEP_SUMMARY '| --- | --- |'
          $incomplete = @()
          foreach ($name in $names) {
            $row = @($report.checks | Where-Object { $_.name -eq $name }) | Select-Object -First 1
            $status = if ($null -eq $row) { 'missing' } else { [string]$row.status }
            Add-Content $env:GITHUB_STEP_SUMMARY "| $name | $status |"
            if ($status -ne 'passed') { $incomplete += "$name=$status" }
          }
          if ($incomplete.Count -gt 0) {
            $details = $incomplete -join ', '
            Write-Host "::warning title=Incomplete native verification::$details. Green Python/static checks do not establish a native PASS."
            Add-Content $env:GITHUB_STEP_SUMMARY ""
            Add-Content $env:GITHUB_STEP_SUMMARY "**Native verification incomplete.** Missing DLLs or a live tModLoader self-test must not be interpreted as a passing native build/test."
          }

      - name: Upload tML build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tml-build-logs
          overwrite: true
          path: |
            artifacts/validation/
          if-no-files-found: warn

      - name: Upload native input identity receipt
        uses: actions/upload-artifact@v4
        with:
          name: native-ci-inputs
          overwrite: true
          path: artifacts/native-inputs/native.json
          if-no-files-found: error

  # The full native suite and the complete release source-pack generation are
  # independent. Isolated runners avoid races in generated resources/obj/bin.
  tml-package:
    name: Windows package and Studio lifecycle smoke
    runs-on: windows-latest
    steps:
      - name: Preserve Git blob bytes for cross-platform release verification
        shell: pwsh
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-native-ci
        with:
          github-token: ${{ github.token }}
      - name: Record packaging dependency identities
        run: python tools/testing/verify_ci_native_inputs.py --write-role package --output artifacts/native-inputs/package.json
      - name: Package Release mod and self-contained Studio with official tModLoader
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python tools/testing/test_tmod_package.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./tools/build/package_tmod.ps1
      - name: Studio extraction and C# to bundled Python lifecycle smoke
        shell: pwsh
        run: dotnet run --project tests/native/StudioBundleChecks/StudioBundleChecks.csproj -- --bundle-root mod/InfiniCrafterLocal
      - name: Upload verified playable mod package
        uses: actions/upload-artifact@v4
        with:
          name: InfiniCrafterLocal-tmod
          overwrite: true
          path: artifacts/package/
          if-no-files-found: error
      - name: Upload packaging diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: tmod-packaging-diagnostics
          overwrite: true
          path: artifacts/package/*.log
          if-no-files-found: ignore
      - name: Upload package input identity receipt
        uses: actions/upload-artifact@v4
        with:
          name: package-ci-inputs
          overwrite: true
          path: artifacts/native-inputs/package.json
          if-no-files-found: error

  # Keep the existing check name and fail closed if either parallel leg failed,
  # was skipped/cancelled, or resolved different mutable upstream references.
  tml-build:
    name: Windows tModLoader/dotnet build smoke
    needs: [tml-native, tml-package]
    permissions:
      contents: read
      actions: read
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Require both Windows gates
        env:
          NATIVE_RESULT: ${{ needs.tml-native.result }}
          PACKAGE_RESULT: ${{ needs.tml-package.result }}
        run: test "$NATIVE_RESULT" = success && test "$PACKAGE_RESULT" = success
      - name: Download this run's native input receipts
        uses: actions/download-artifact@v4
        with:
          pattern: '*-ci-inputs'
          github-token: ${{ github.token }}
          run-id: ${{ github.run_id }}
          path: artifacts/native-inputs
      - name: Require identical tested and packaged native inputs
        run: python tools/testing/verify_ci_native_inputs.py --verify artifacts/native-inputs
