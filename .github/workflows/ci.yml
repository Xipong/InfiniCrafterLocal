name: InfiniCrafterLocal CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A PR gets one full workflow instead of both branch-push and PR copies.
# Unique run IDs keep every main/manual run, including pending runs, independent.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  python-tests:
    name: Python tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: LocalGenerator/requirements-dev.lock
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r LocalGenerator/requirements-dev.lock
      - name: Shared Python validation gates
        run: python tools/validate_release.py --group python

  strict-hygiene:
    name: Strict hygiene and static contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: LocalGenerator/requirements-dev.lock
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r LocalGenerator/requirements-dev.lock
      - name: Shared static validation gates
        run: python tools/validate_release.py --group static
      - name: Strict archive hygiene
        run: |
          archive_root="$(mktemp -d)"
          git archive --format=tar HEAD | tar -xf - -C "$archive_root"
          (cd "$archive_root" && python tools/check_project_hygiene.py --strict-archive)

  tml-build:
    name: Windows tModLoader/dotnet build smoke
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      # Match ParticleLibrary's declared modReferences version (3.2.1.0).
      # Luminance recommends using its latest GitHub release DLL for project references.
      - name: Download tML mod reference DLLs
        shell: pwsh
        run: |
          $depsRoot = Join-Path $env:RUNNER_TEMP "infinicrafter-compile-deps"
          $particleLibraryDll = Join-Path $depsRoot "ParticleLibrary\ParticleLibrary.dll"
          $luminanceDll = Join-Path $depsRoot "Luminance\bin\Debug\net8.0\Luminance.dll"
          New-Item -ItemType Directory -Force -Path (Split-Path $particleLibraryDll), (Split-Path $luminanceDll) | Out-Null

          $particleLibraryUrl = "https://raw.githubusercontent.com/SnowyStarfall/ParticleLibrary/7b945efa780a4376ce5abaa8a284c06f159074f6/ParticleLibrary.dll"
          $luminanceUrl = "https://github.com/LucilleKarma/Luminance/releases/latest/download/Luminance.dll"

          & curl.exe --fail --location --retry 3 --silent --show-error --output $particleLibraryDll $particleLibraryUrl
          if ($LASTEXITCODE -ne 0) { throw "Failed to download ParticleLibrary.dll (curl exit $LASTEXITCODE)." }
          & curl.exe --fail --location --retry 3 --silent --show-error --output $luminanceDll $luminanceUrl
          if ($LASTEXITCODE -ne 0) { throw "Failed to download Luminance.dll (curl exit $LASTEXITCODE)." }

          foreach ($dll in @($particleLibraryDll, $luminanceDll)) {
            $header = [System.IO.File]::ReadAllBytes($dll)
            if ($header.Length -lt 2 -or $header[0] -ne 0x4D -or $header[1] -ne 0x5A) {
              throw "Downloaded dependency is not a Windows DLL: $dll"
            }
          }

          "INFINI_TML_DEPS_SRC=$depsRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      # tml-build currently queries the unauthenticated GitHub API to resolve version aliases.
      # Seed its expected cache with the workflow token so CI does not depend on the shared anonymous rate limit.
      - name: Seed tML SDK release cache
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          $headers = @{
            Accept = "application/vnd.github+json"
            Authorization = "Bearer $env:GITHUB_TOKEN"
            "X-GitHub-Api-Version" = "2022-11-28"
          }
          $apiReleases = Invoke-RestMethod -Uri "https://api.github.com/repos/tModLoader/tModLoader/releases?per_page=100" -Headers $headers
          $apiReleases = @($apiReleases | Sort-Object { [DateTimeOffset]::Parse($_.published_at) } -Descending)

          $entries = @()
          foreach ($release in $apiReleases) {
            $version = $null
            $versionText = ([string]$release.tag_name) -replace "^v", ""
            if (-not [Version]::TryParse($versionText, [ref]$version)) { continue }

            $asset = @($release.assets | Where-Object { $_.name -eq "tModLoader.zip" } | Select-Object -First 1)
            if ($asset.Count -eq 0) { continue }

            $entries += [pscustomobject]@{
              Version = $version
              DownloadUrl = [string]$asset[0].browser_download_url
              PreRelease = [bool]$release.prerelease
            }
          }

          $stable = $entries | Where-Object { -not $_.PreRelease } | Select-Object -First 1
          $preview = $entries | Where-Object { $_.PreRelease } | Select-Object -First 1
          if ($null -eq $stable -or $null -eq $preview) {
            throw "Could not find stable and preview tModLoader releases with tModLoader.zip assets."
          }

          $cacheRoot = Join-Path $env:APPDATA "tml-build"
          New-Item -ItemType Directory -Force -Path $cacheRoot | Out-Null
          $cachePath = Join-Path $cacheRoot "cached_versions"
          $stream = [System.IO.File]::Create($cachePath)
          $writer = [System.IO.BinaryWriter]::new($stream, [System.Text.Encoding]::UTF8)
          try {
            $writer.Write([DateTime]::Now.ToBinary())
            $writer.Write([Int32]$entries.Count)
            foreach ($entry in $entries) {
              $version = $entry.Version
              $writer.Write([Int32]$version.Major)
              $writer.Write([Int32]$version.Minor)
              $writer.Write([Int32]$version.Build)
              $writer.Write([Int32]$version.Revision)
              $writer.Write([string]$entry.DownloadUrl)
            }
            foreach ($version in @($stable.Version, $preview.Version)) {
              $writer.Write([Int32]$version.Major)
              $writer.Write([Int32]$version.Minor)
              $writer.Write([Int32]$version.Build)
              $writer.Write([Int32]$version.Revision)
            }
          }
          finally {
            $writer.Dispose()
          }

      # The tML SDK fills its local package feed/alias cache during restore.
      # Resolve that first so the subsequent build sees tModLoader reference assemblies.
      - name: Restore tML SDK references
        shell: pwsh
        run: |
          dotnet restore ModSources/InfiniCrafterLocal/InfiniCrafterLocal.csproj --verbosity normal
          exit $LASTEXITCODE
      - name: Locate restored references for native CPU regressions
        shell: pwsh
        run: |
          # The first SDK restore creates the version-alias props; reevaluate
          # the graph so the exact tML package appears in project.assets.json.
          dotnet restore ModSources/InfiniCrafterLocal/InfiniCrafterLocal.csproj --verbosity minimal
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $assets = Get-Content ModSources/InfiniCrafterLocal/obj/project.assets.json -Raw | ConvertFrom-Json
          $tml = @($assets.libraries.PSObject.Properties | Where-Object { $_.Name -like 'tModLoader/*' })
          if ($tml.Count -ne 1) { throw 'Expected one resolved tModLoader package for native checks.' }
          $references = @($assets.packageFolders.PSObject.Properties.Name | ForEach-Object {
            $candidate = Join-Path $_ ($tml[0].Value.path + '/lib/net8.0')
            if (Test-Path (Join-Path $candidate 'tModLoader.dll')) { $candidate }
          })
          if ($references.Count -ne 1) { throw 'Could not locate the resolved native tModLoader references.' }
          "INFINI_TML_REFERENCE_DIR=$($references[0])" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      # CI validates compilation; the SDK packaging target requires a local Steam install.
      - name: Attempt tML project build
        id: tml
        shell: pwsh
        env:
          TmlBuildMod: 'false'
        run: |
          python tools/validate_release.py --group build --require-build
          exit $LASTEXITCODE
      - name: Native verification coverage
        if: always()
        shell: pwsh
        run: |
          $path = 'artifacts/validation/validation_report.json'
          $report = if (Test-Path $path) { Get-Content $path -Raw | ConvertFrom-Json } else { $null }
          $names = @('tml_build', 'native_checks', 'tml_runtime_selftest')
          Add-Content $env:GITHUB_STEP_SUMMARY '### Native verification coverage'
          Add-Content $env:GITHUB_STEP_SUMMARY '| Check | Actual status |'
          Add-Content $env:GITHUB_STEP_SUMMARY '| --- | --- |'
          $incomplete = @()
          foreach ($name in $names) {
            $row = @($report.checks | Where-Object { $_.name -eq $name }) | Select-Object -First 1
            $status = if ($null -eq $row) { 'missing' } else { [string]$row.status }
            Add-Content $env:GITHUB_STEP_SUMMARY "| $name | $status |"
            if ($status -ne 'passed') { $incomplete += "$name=$status" }
          }
          if ($incomplete.Count -gt 0) {
            $details = $incomplete -join ', '
            Write-Host "::warning title=Incomplete native verification::$details. Green Python/static checks do not establish a native PASS."
            Add-Content $env:GITHUB_STEP_SUMMARY ""
            Add-Content $env:GITHUB_STEP_SUMMARY "**Native verification incomplete.** Missing DLLs or a live tModLoader self-test must not be interpreted as a passing native build/test."
          }

      - name: Upload tML build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tml-build-logs
          path: |
            artifacts/validation/
          if-no-files-found: warn
