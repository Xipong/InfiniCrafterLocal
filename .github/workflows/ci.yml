name: InfiniCrafterLocal CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A PR gets one full workflow instead of both branch-push and PR copies.
# Unique run IDs keep every main/manual run, including pending runs, independent.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  python-tests:
    name: Python tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: LocalGenerator/requirements-dev.lock
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r LocalGenerator/requirements-dev.lock
      - name: Shared Python validation gates
        run: python tools/validate_release.py --group python

  strict-hygiene:
    name: Strict hygiene and static contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: LocalGenerator/requirements-dev.lock
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r LocalGenerator/requirements-dev.lock
      - name: Shared static validation gates
        run: python tools/validate_release.py --group static
      - name: Strict archive hygiene
        run: |
          archive_root="$(mktemp -d)"
          git archive --format=tar HEAD | tar -xf - -C "$archive_root"
          (cd "$archive_root" && python tools/check_project_hygiene.py --strict-archive)

  tml-build:
    name: Windows tModLoader/dotnet build smoke
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Attempt tML project build
        id: tml
        shell: pwsh
        run: |
          python tools/validate_release.py --group build
          exit $LASTEXITCODE
      - name: Upload tML build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tml-build-logs
          path: |
            artifacts/validation/
          if-no-files-found: warn
