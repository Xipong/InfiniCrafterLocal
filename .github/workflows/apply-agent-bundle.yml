name: Apply performance work bundle

on:
  push:
    branches:
      - perf/pr333-cold-under-5s

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply and publish staged patch
        shell: bash
        run: |
          set -euo pipefail
          if ! compgen -G '.perf-patch/part-*' > /dev/null; then
            echo 'No staged patch parts.'
            exit 0
          fi
          cat .perf-patch/part-* > "$RUNNER_TEMP/perf.patch"
          git apply --check "$RUNNER_TEMP/perf.patch"
          git apply "$RUNNER_TEMP/perf.patch"
          rm -rf .perf-patch
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'perf: rebuild cold parent analysis around shared compact IR'
          git push origin HEAD:perf/pr333-cold-under-5s
