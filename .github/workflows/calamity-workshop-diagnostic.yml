name: Calamity Workshop availability diagnostic
on:
  push:
    branches:
      - 'codex/calamity-workshop-diagnostic'
  pull_request:
    paths:
      - '.github/workflows/calamity-workshop-diagnostic.yml'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - name: Prepare official SteamCMD
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y lib32gcc-s1 lib32stdc++6
          mkdir -p "$RUNNER_TEMP/steamcmd" "$RUNNER_TEMP/tml-workshop"
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/steamcmd.tar.gz" \
            https://steamcdn-a.akamaihd.net/client/installer/steamcmd_linux.tar.gz
          tar -xzf "$RUNNER_TEMP/steamcmd.tar.gz" -C "$RUNNER_TEMP/steamcmd"
      - name: Download official public Workshop items anonymously
        shell: bash
        run: |
          set -uo pipefail
          status=0
          for item in 2824688072 2824688266; do
            printf '\nRequesting app 1281930, Workshop item %s\n' "$item"
            timeout 700 "$RUNNER_TEMP/steamcmd/steamcmd.sh" \
              +force_install_dir "$RUNNER_TEMP/tml-workshop" \
              +login anonymous \
              +workshop_download_item 1281930 "$item" validate \
              +quit > "$RUNNER_TEMP/steamcmd-$item.log" 2>&1
            code=$?
            tail -n 35 "$RUNNER_TEMP/steamcmd-$item.log"
            printf 'SteamCMD exit code for %s: %s\n' "$item" "$code"
            mapfile -d '' files < <(find "$RUNNER_TEMP" -path "*/workshop/content/1281930/$item/*" -type f -iname '*.tmod' -print0)
            if (( ${#files[@]} == 0 )); then
              printf 'No .tmod file found for item %s\n' "$item" >&2
              status=1
            else
              for file in "${files[@]}"; do
                printf 'Downloaded: %s bytes: ' "$file"
                stat -c '%s' "$file"
                sha256sum "$file"
              done
            fi
            if (( code != 0 )); then status=1; fi
          done
          exit "$status"
      - name: Install pinned official tModLoader
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/tml.zip" \
            https://github.com/tModLoader/tModLoader/releases/download/v2026.08.3.0/tModLoader.zip
          echo '61e865f3702b12ce4a26c5a90b9de99a12c65ffc228455eb3390ce54af1eab15  '"$RUNNER_TEMP/tml.zip" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/tml"
          unzip -q "$RUNNER_TEMP/tml.zip" -d "$RUNNER_TEMP/tml"
          test -f "$RUNNER_TEMP/tml/tModLoader.dll"
          printf 'Official tModLoader DLL: '
          sha256sum "$RUNNER_TEMP/tml/tModLoader.dll"
      - name: Verify and unpack packages inside runner temp
        shell: bash
        run: |
          set -euo pipefail
          workshop="$RUNNER_TEMP/tml-workshop/steamapps/workshop/content/1281930"
          python .github/scripts/inspect_tmod.py "$workshop/2824688072/2026.6/CalamityMod.tmod" \
            --name CalamityMod --out "$RUNNER_TEMP/calamity-inspection/CalamityMod"
          python .github/scripts/inspect_tmod.py "$workshop/2824688266/2025.12/CalamityModMusic.tmod" \
            --name CalamityModMusic --out "$RUNNER_TEMP/calamity-inspection/CalamityModMusic"
      - name: Checkout native loader at reviewed commit
        uses: actions/checkout@v4
        with:
          ref: 110c13f0d2533b38f335031180f787c20cbc7149
          path: ifc
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install native graphics dependencies
        run: sudo apt-get install -y libegl1 libgl1 libgl1-mesa-dri libopenal1
      - name: Configure native workbench references
        working-directory: ifc
        shell: bash
        run: |
          set -euo pipefail
          native="$RUNNER_TEMP/tml/Libraries/Native/Linux"
          test -f "$native/libFNA3D.so.0"
          test -f "$RUNNER_TEMP/tml/Content/PixelShader.xnb"
          echo "INFINI_TML_NATIVE_DIR=$native" >> "$GITHUB_ENV"
          echo "INFINI_TML_CONTENT_DIR=$RUNNER_TEMP/tml/Content" >> "$GITHUB_ENV"
          deps="$RUNNER_TEMP/ifc-deps"
          python -m toolbox workbench setup-vfx --deps-root "$deps"
          echo "INFINI_TML_DEPS_SRC=$deps" >> "$GITHUB_ENV"
          echo "INFINI_PARTICLE_ASSET_DIR=$deps/particle-assets" >> "$GITHUB_ENV"
          dotnet restore ModSources/InfiniCrafterLocal/InfiniCrafterLocal.csproj -p:TmlVersion=2026.08.3.0
          dotnet restore ModSources/InfiniCrafterLocal/InfiniCrafterLocal.csproj -p:TmlVersion=2026.08.3.0
          python - <<'PY'
          import json, os
          from pathlib import Path
          data = json.loads(Path('ModSources/InfiniCrafterLocal/obj/project.assets.json').read_text())
          packages = [entry for name, entry in data['libraries'].items() if name.lower().startswith('tmodloader/')]
          if len(packages) != 1: raise SystemExit('Expected one tModLoader reference package')
          refs = [Path(root) / packages[0]['path'] / 'lib/net8.0' for root in data['packageFolders']]
          refs = [path.resolve() for path in refs if (path / 'tModLoader.dll').is_file()]
          if len(refs) != 1: raise SystemExit('Expected one tModLoader reference directory')
          with open(os.environ['GITHUB_ENV'], 'a') as stream:
              stream.write(f'INFINI_TML_REFERENCE_DIR={refs[0]}\n')
          PY
      - name: Build workbench
        working-directory: ifc
        run: python tools/item-test-workbench/workbench.py build
      - name: Attempt native Terratomere with original Workshop assemblies
        working-directory: ifc
        shell: bash
        run: |
          set -uo pipefail
          echo 'Diagnostic only: extracted Info reconstructed into build.txt; assets are original packed rawimg, no full tML game/client emulation.'
          python - <<'PY'
          import json, os
          from pathlib import Path
          scenario = json.loads(Path('tools/item-test-workbench/scenarios/primary.json').read_text())
          scenario['assertions'] = [{'kind': 'no_nonfinite'}]
          Path(os.environ['RUNNER_TEMP'], 'terratomere-scenario.json').write_text(json.dumps(scenario))
          PY
          mods="$RUNNER_TEMP/calamity-inspection"
          output="$RUNNER_TEMP/terratomere-diagnostic"
          python tools/item-test-workbench/workbench.py loader-run \
            --native-item CalamityMod/Terratomere \
            --scenario "$RUNNER_TEMP/terratomere-scenario.json" \
            --mod "$mods/CalamityModMusic/CalamityModMusic.dll" "$mods/CalamityModMusic" \
            --mod "$mods/CalamityMod/CalamityMod.dll" "$mods/CalamityMod" \
            --out "$output" --no-build --timeout 600
          status=$?
          for log in stdout.log stderr.log native.json; do
            if [[ -f "$output/$log" ]]; then
              echo "--- $log (tail) ---"
              tail -c 30000 "$output/$log"
            fi
          done
          echo "Loader exit: $status"
          exit "$status"
