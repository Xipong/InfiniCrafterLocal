name: Calamity Workshop availability diagnostic
on:
  push:
    branches:
      - 'codex/calamity-workshop-diagnostic'
  pull_request:
    paths:
      - '.github/workflows/calamity-workshop-diagnostic.yml'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Prepare official SteamCMD
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y lib32gcc-s1 lib32stdc++6
          mkdir -p "$RUNNER_TEMP/steamcmd" "$RUNNER_TEMP/tml-workshop"
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/steamcmd.tar.gz" \
            https://steamcdn-a.akamaihd.net/client/installer/steamcmd_linux.tar.gz
          tar -xzf "$RUNNER_TEMP/steamcmd.tar.gz" -C "$RUNNER_TEMP/steamcmd"
      - name: Download official public Workshop items anonymously
        shell: bash
        run: |
          set -uo pipefail
          status=0
          for item in 2824688072 2824688266; do
            printf '\nRequesting app 1281930, Workshop item %s\n' "$item"
            timeout 700 "$RUNNER_TEMP/steamcmd/steamcmd.sh" \
              +force_install_dir "$RUNNER_TEMP/tml-workshop" \
              +login anonymous \
              +workshop_download_item 1281930 "$item" validate \
              +quit > "$RUNNER_TEMP/steamcmd-$item.log" 2>&1
            code=$?
            tail -n 35 "$RUNNER_TEMP/steamcmd-$item.log"
            printf 'SteamCMD exit code for %s: %s\n' "$item" "$code"
            mapfile -d '' files < <(find "$RUNNER_TEMP" -path "*/workshop/content/1281930/$item/*" -type f -iname '*.tmod' -print0)
            if (( ${#files[@]} == 0 )); then
              printf 'No .tmod file found for item %s\n' "$item" >&2
              status=1
            else
              for file in "${files[@]}"; do
                printf 'Downloaded: %s bytes: ' "$file"
                stat -c '%s' "$file"
                sha256sum "$file"
              done
            fi
            if (( code != 0 )); then status=1; fi
          done
          exit "$status"
      - name: Install pinned official tModLoader
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/tml.zip" \
            https://github.com/tModLoader/tModLoader/releases/download/v2026.08.3.0/tModLoader.zip
          echo '61e865f3702b12ce4a26c5a90b9de99a12c65ffc228455eb3390ce54af1eab15  '"$RUNNER_TEMP/tml.zip" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/tml"
          unzip -q "$RUNNER_TEMP/tml.zip" -d "$RUNNER_TEMP/tml"
          test -f "$RUNNER_TEMP/tml/tModLoader.dll"
          printf 'Official tModLoader DLL: '
          sha256sum "$RUNNER_TEMP/tml/tModLoader.dll"
      - name: Verify packages and inspect embedded assembly and metadata
        shell: bash
        run: |
          set -euo pipefail
          workshop="$RUNNER_TEMP/tml-workshop/steamapps/workshop/content/1281930"
          python .github/scripts/inspect_tmod.py "$workshop/2824688072/2026.6/CalamityMod.tmod" \
            --name CalamityMod --out "$RUNNER_TEMP/calamity-inspection/CalamityMod"
          python .github/scripts/inspect_tmod.py "$workshop/2824688266/2025.12/CalamityModMusic.tmod" \
            --name CalamityModMusic --out "$RUNNER_TEMP/calamity-inspection/CalamityModMusic"
