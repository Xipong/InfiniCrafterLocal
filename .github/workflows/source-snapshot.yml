name: Temporary source snapshot

on:
  push:
    branches:
      - perf/pr333-cold-under-5s

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Pack repository tree
        run: git archive --format=tar.gz --output="$RUNNER_TEMP/source-snapshot.tar.gz" HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: source-snapshot
          path: ${{ runner.temp }}/source-snapshot.tar.gz
          retention-days: 1
          if-no-files-found: error
