name: Temporary source snapshot

on:
  push:
    branches:
      - perf/pr333-cold-under-5s

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Pack repository working tree
        run: tar --exclude=.git -czf source-snapshot.tar.gz .
      - uses: actions/upload-artifact@v4
        with:
          name: source-snapshot
          path: source-snapshot.tar.gz
          retention-days: 1
          if-no-files-found: error
