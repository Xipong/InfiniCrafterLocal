name: Temporary parent CPU trace

on:
  push:
    branches:
      - perf/pr333-cold-under-5s

permissions:
  contents: read

jobs:
  trace:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - name: Preserve Git blob bytes
        shell: pwsh
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Download native check dependencies
        shell: pwsh
        run: |
          $depsRoot = Join-Path $env:RUNNER_TEMP 'infinicrafter-compile-deps'
          $particleLibraryDll = Join-Path $depsRoot 'ParticleLibrary\ParticleLibrary.dll'
          $luminanceDll = Join-Path $depsRoot 'Luminance\bin\Debug\net8.0\Luminance.dll'
          New-Item -ItemType Directory -Force -Path (Split-Path $particleLibraryDll), (Split-Path $luminanceDll) | Out-Null
          & curl.exe --fail --location --retry 3 --silent --show-error --output $particleLibraryDll 'https://raw.githubusercontent.com/SnowyStarfall/ParticleLibrary/7b945efa780a4376ce5abaa8a284c06f159074f6/ParticleLibrary.dll'
          if ($LASTEXITCODE -ne 0) { throw "ParticleLibrary download failed: $LASTEXITCODE" }
          & curl.exe --fail --location --retry 3 --silent --show-error --output $luminanceDll 'https://github.com/LucilleKarma/Luminance/releases/latest/download/Luminance.dll'
          if ($LASTEXITCODE -ne 0) { throw "Luminance download failed: $LASTEXITCODE" }
          "INFINI_TML_DEPS_SRC=$depsRoot" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Seed tML SDK release cache
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          $headers = @{ Accept='application/vnd.github+json'; Authorization="Bearer $env:GITHUB_TOKEN"; 'X-GitHub-Api-Version'='2022-11-28' }
          $releases = Invoke-RestMethod -Uri 'https://api.github.com/repos/tModLoader/tModLoader/releases?per_page=100' -Headers $headers
          $releases = @($releases | Sort-Object { [DateTimeOffset]::Parse($_.published_at) } -Descending)
          $entries = @()
          foreach ($release in $releases) {
            $version = $null
            $versionText = ([string]$release.tag_name) -replace '^v', ''
            if (-not [Version]::TryParse($versionText, [ref]$version)) { continue }
            $asset = @($release.assets | Where-Object { $_.name -eq 'tModLoader.zip' } | Select-Object -First 1)
            if ($asset.Count -eq 0) { continue }
            $entries += [pscustomobject]@{ Version=$version; DownloadUrl=[string]$asset[0].browser_download_url; PreRelease=[bool]$release.prerelease }
          }
          $stable = $entries | Where-Object { -not $_.PreRelease } | Select-Object -First 1
          $preview = $entries | Where-Object PreRelease | Select-Object -First 1
          if ($null -eq $stable -or $null -eq $preview) { throw 'Missing tML stable/preview release.' }
          $cacheRoot = Join-Path $env:APPDATA 'tml-build'; New-Item -ItemType Directory -Force -Path $cacheRoot | Out-Null
          $writer = [System.IO.BinaryWriter]::new([System.IO.File]::Create((Join-Path $cacheRoot 'cached_versions')), [System.Text.Encoding]::UTF8)
          try {
            $writer.Write([DateTime]::Now.ToBinary()); $writer.Write([Int32]$entries.Count)
            foreach ($entry in $entries) {
              $v=$entry.Version; $writer.Write([Int32]$v.Major); $writer.Write([Int32]$v.Minor); $writer.Write([Int32]$v.Build); $writer.Write([Int32]$v.Revision); $writer.Write([string]$entry.DownloadUrl)
            }
            foreach ($v in @($stable.Version,$preview.Version)) { $writer.Write([Int32]$v.Major); $writer.Write([Int32]$v.Minor); $writer.Write([Int32]$v.Build); $writer.Write([Int32]$v.Revision) }
          } finally { $writer.Dispose() }
      - name: Restore tML references
        shell: pwsh
        env:
          TmlBuildMod: 'false'
        run: |
          dotnet restore ModSources/InfiniCrafterLocal/InfiniCrafterLocal.csproj --verbosity minimal
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet restore ModSources/InfiniCrafterLocal/InfiniCrafterLocal.csproj --verbosity minimal
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $assets = Get-Content ModSources/InfiniCrafterLocal/obj/project.assets.json -Raw | ConvertFrom-Json
          $tml = @($assets.libraries.PSObject.Properties | Where-Object { $_.Name -like 'tModLoader/*' })
          if ($tml.Count -ne 1) { throw 'Expected one tModLoader package.' }
          $references = @($assets.packageFolders.PSObject.Properties.Name | ForEach-Object {
            $candidate = Join-Path $_ ($tml[0].Value.path + '/lib/net8.0')
            if (Test-Path (Join-Path $candidate 'tModLoader.dll')) { $candidate }
          })
          if ($references.Count -ne 1) { throw 'Could not locate tModLoader references.' }
          "INFINI_TML_REFERENCE_DIR=$($references[0])" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Build profiler
        shell: pwsh
        run: |
          dotnet build tools/native/EngineRuntimeChecks.csproj -c Release -p:InfiniTmlReferenceDir="$env:INFINI_TML_REFERENCE_DIR" -p:InfiniExternalDepsRoot="$env:INFINI_TML_DEPS_SRC"
          exit $LASTEXITCODE
      - name: Trace Nebula Blaze and Last Prism
        shell: pwsh
        run: |
          dotnet tool install --global dotnet-trace
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $traceTool = Join-Path $env:USERPROFILE '.dotnet\tools\dotnet-trace.exe'
          $dll = Resolve-Path 'tools/native/bin/Release/net8.0/EngineRuntimeChecks.dll'
          New-Item -ItemType Directory -Force -Path artifacts/parent-trace | Out-Null
          & $traceTool collect --profile cpu-sampling --format NetTrace --output artifacts/parent-trace/nebula-prism.nettrace --show-child-io -- dotnet $dll --profile-parent-craft nebula-prism
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $traceTool report artifacts/parent-trace/nebula-prism.nettrace topN --number 100 --inclusive --verbose | Tee-Object -FilePath artifacts/parent-trace/top-inclusive.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $traceTool report artifacts/parent-trace/nebula-prism.nettrace topN --number 100 --verbose | Tee-Object -FilePath artifacts/parent-trace/top-exclusive.txt
          exit $LASTEXITCODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: parent-cpu-trace
          path: artifacts/parent-trace/
          retention-days: 2
          if-no-files-found: warn
