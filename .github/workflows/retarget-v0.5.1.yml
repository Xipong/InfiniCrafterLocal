name: One-time v0.5.1 tag retarget

on:
  workflow_dispatch:
    inputs:
      target_sha:
        description: Exact green main commit to receive v0.5.1
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: one-time-v0.5.1-tag-retarget
  cancel-in-progress: false

jobs:
  retarget:
    if: github.repository == 'Xipong/InfiniCrafterLocal' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      actions: read
    steps:
      # No repository code or third-party action runs with this write token.
      - name: Validate exact release commit and atomically move only v0.5.1
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ inputs.target_sha }}
        shell: python
        run: |
          import base64
          import json
          import os
          import re
          import subprocess
          import tempfile

          REPO = "Xipong/InfiniCrafterLocal"
          OLD = "a0c5ea23641f4ba7cb946086d3e8806800bf0b39"
          TAG = "refs/tags/v0.5.1"
          target = os.environ["TARGET_SHA"]

          def require(condition, message):
              if not condition:
                  raise SystemExit(message)

          def api(path):
              result = subprocess.run(
                  ["gh", "api", f"repos/{REPO}/{path}"],
                  check=True, capture_output=True, text=True,
              )
              return json.loads(result.stdout)

          def verify_refs():
              require(api("git/ref/heads/main")["object"]["sha"] == target,
                      "Target is not the current main commit")
              tag = api("git/ref/tags/v0.5.1")
              require(tag["ref"] == TAG and tag["object"]["type"] == "commit"
                      and tag["object"]["sha"] == OLD,
                      "Tag no longer matches the approved original lightweight tag")

          require(re.fullmatch(r"[0-9a-f]{40}", target), "Expected a full lowercase commit SHA")
          require(target != OLD, "Target must be the new release commit")
          verify_refs()
          comparison = api(f"compare/{OLD}...{target}")
          require(comparison["status"] == "ahead", "Target must descend from the original release")
          build = api(f"contents/ModSources/InfiniCrafterLocal/build.txt?ref={target}")
          version = base64.b64decode(build["content"]).decode("utf-8")
          require(re.findall(r"(?m)^version\s*=\s*(\S+)\s*$", version) == ["0.5.1"],
                  "Target version is not exactly 0.5.1")
          runs = api(f"actions/workflows/ci.yml/runs?head_sha={target}&event=push&per_page=100")["workflow_runs"]
          runs = [r for r in runs if r["head_sha"] == target and r["head_branch"] == "main"]
          require(runs, "No main push CI exists for this exact SHA")
          latest = max(runs, key=lambda r: r["id"])
          require(latest["status"] == "completed" and latest["conclusion"] == "success",
                  "Latest exact-SHA main push CI has not succeeded")
          release = api("releases/420003134")
          require(release["tag_name"] == "v0.5.1", "Expected release no longer uses v0.5.1")

          # gh's normal credential helper uses the ephemeral job token; no stored secret.
          subprocess.run(["gh", "auth", "setup-git"], check=True)
          with tempfile.TemporaryDirectory() as directory:
              def git(*args):
                  subprocess.run(["git", "-C", directory, *args], check=True)
              git("init", "--bare")
              git("remote", "add", "origin", f"https://github.com/{REPO}.git")
              git("fetch", "--no-tags", "--depth=1", "origin", target)
              verify_refs()
              # Lease makes the old-SHA check atomic at GitHub, including concurrent writers.
              git("push", f"--force-with-lease={TAG}:{OLD}", "origin", f"{target}:{TAG}")
          updated = api("git/ref/tags/v0.5.1")
          require(updated["object"]["type"] == "commit" and updated["object"]["sha"] == target,
                  "Post-update tag verification failed")
          require(api("releases/420003134")["tag_name"] == "v0.5.1",
                  "Post-update release verification failed")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              summary.write(f"Moved `{TAG}` from `{OLD}` to `{target}`.\n\nCI: {latest['html_url']}\n\n")
              summary.write("Release 420003134 was preserved. Remove this temporary workflow now.\n")
