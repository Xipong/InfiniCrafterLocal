name: PR355 temporary canonical refresh
on:
  push:
    branches: [chore/pr355-canonical-refresh-20261115]
permissions:
  contents: read
jobs:
  refresh:
    if: github.repository == 'Xipong/InfiniCrafterLocal' && github.ref == 'refs/heads/chore/pr355-canonical-refresh-20261115'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r generator/requirements-dev.lock
      - name: Run canonical generators
        run: |
          python tools/generate/build_native_source_pack.py --refresh-pin
          python tools/build_documentation.py
          python tools/build_documentation.py --check
          git diff --check
      - name: Publish generated blobs only, never move a branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import base64, hashlib, json, os, pathlib, subprocess, urllib.request, zipfile
          root = pathlib.Path.cwd()
          expected = {'START_HERE.html', 'mod/InfiniCrafterLocal/Common/Services/Generation/NativeSourcePackBuild.g.cs'}
          changed = set(subprocess.check_output(['git', 'diff', '--name-only'], text=True).splitlines())
          assert changed == expected, changed
          out = pathlib.Path(os.environ['RUNNER_TEMP']) / 'pr355-refresh'
          out.mkdir()
          receipt = {'sourceCommit': os.environ['GITHUB_SHA'], 'files': {}}
          for path in sorted(expected):
              data = root.joinpath(path).read_bytes()
              request = urllib.request.Request('https://api.github.com/repos/Xipong/InfiniCrafterLocal/git/blobs',
                  data=json.dumps({'content': base64.b64encode(data).decode('ascii'), 'encoding': 'base64'}).encode(),
                  headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json',
                           'Content-Type': 'application/json', 'X-GitHub-Api-Version': '2022-11-28'}, method='POST')
              with urllib.request.urlopen(request) as response:
                  sha = json.load(response)['sha']
              local = subprocess.check_output(['git', 'hash-object', path], text=True).strip()
              assert sha == local, path
              receipt['files'][path] = {'blob': sha, 'sha256': hashlib.sha256(data).hexdigest(), 'bytes': len(data)}
          (out / 'receipt.json').write_text(json.dumps(receipt, indent=2) + '\n')
          paths = subprocess.check_output(['git', 'ls-files', '-z']).decode().split('\0')
          with zipfile.ZipFile(out / 'source.zip', 'w', zipfile.ZIP_DEFLATED) as archive:
              for path in paths:
                  if path and root.joinpath(path).is_file(): archive.write(root / path, path)
          print(json.dumps(receipt, indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: pr355-canonical-refresh
          path: ${{ runner.temp }}/pr355-refresh/
          if-no-files-found: error
          retention-days: 2
